name: Build Madeira IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/madeira-ios.yml'

permissions:
  contents: read

concurrency:
  group: madeira-ipad-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 350
    env:
      JOBS: '3'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - name: Check out the IPA build contribution at a fixed revision
        uses: actions/checkout@v4
        with:
          repository: JMRBDev/Madeira
          ref: ef496822ca427b4b000eaf7c78d3a570e23182e1
          path: source
          submodules: recursive
          persist-credentials: false

      - name: Record build environment
        run: |
          mkdir -p build-logs
          {
            uname -a
            sysctl -n hw.ncpu hw.memsize
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            df -h .
            git rev-parse HEAD
            git submodule status --recursive
          } | tee build-logs/environment.txt
          test "$(uname -m)" = arm64 || {
            echo 'This build requires an Apple Silicon macOS runner.'
            exit 1
          }
          echo "ROOT=$PWD" >> "$GITHUB_ENV"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Apply narrow iOS build fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('FEX/FEXCore/Source/Utils/ArchHelpers/Arm64.cpp')
          text = p.read_text()
          start = text.index('  MEMORY_BASIC_INFORMATION mbi {};')
          end_marker = '                    mbi.Protect, type, mbi.State);'
          end = text.index(end_marker, start) + len(end_marker)
          windows_log = text[start:end]
          portable_log = '''  LogMan::Msg::EFmt("[caspal128] MISALIGNED-UNSUPPORTED Size={} addrReg=x{} addr={:#x} misalign={}",
                              Size, AddressReg, GPRs[AddressReg], GPRs[AddressReg] & 15);'''
          text = text[:start] + '#if defined(_WIN32)\n' + windows_log + '\n#else\n' + portable_log + '\n#endif' + text[end:]
          p.write_text(text)
          p = Path('scripts/build/build-wine.sh')
          text = p.read_text()
          old = 'make -C "$WINE/build-macos" -j"$JOBS"'
          assert text.count(old) == 1
          # The iOS build consumes host tools and generated headers. Its PE
          # modules are already present in the pinned source's app resources.
          p.write_text(text.replace(old, old + ' __tooldeps__ include/all'))
          p = Path('scripts/build/build-fex-ios.sh')
          text = p.read_text()
          old = 'cmake --build "$BUILD" --parallel "$JOBS"'
          assert text.count(old) == 1
          p.write_text(text.replace(old, old + ' --target FEXCore FEXCore_Base fmt cephes_128bit'))
          p = Path('scripts/build/build-freetype-ios.sh')
          text = p.read_text()
          old = '"$ROOT/build/freetype-ios/build.sh"'
          assert text.count(old) == 1
          p.write_text(text.replace(old, 'bash ' + old))
          p = Path('scripts/build/build-llvm-ios.sh')
          text = p.read_text()
          # The upstream patch changed an earlier Darwin check, leaving the
          # actual dead-strip branch unchanged. Patch both exact checks.
          text = text.replace("s.replace(old, 'MATCHES \"Darwin|iOS\"', 1)", "s.replace(old, 'MATCHES \"Darwin|iOS\"')")
          old = 'if compgen -G "$IOS/lib/libLLVM*.a" >/dev/null; then'
          assert old in text
          text = text.replace(old, 'if [[ -f "$IOS/.madeira-complete-v2" ]]; then')
          import re
          meson = Path('research/dxmt/src/airconv/meson.build').read_text()
          targets = list(dict.fromkeys(re.findall(r"-l(LLVM[A-Za-z0-9_]+)", meson)))
          assert 'LLVMPasses' in targets and 'LLVMBitWriter' in targets
          old = 'cmake --build "$IOS" --parallel "$JOBS"'
          assert text.count(old) == 1
          text = text.replace(old, old + ' --target ' + ' '.join(targets))
          text += '\n' + '\n'.join('test -s "$IOS/lib/lib' + target + '.a"' for target in targets)
          text += '\ntouch "$IOS/.madeira-complete-v2"\n'
          p.write_text(text)
          p = Path('.') / 'app/Madeira/ContentView.swift'
          text = p.read_text(encoding='utf-8')
          blocks = [
              ('''        if #available(iOS 26.0, *) {
                      Circle().fill(.clear).glassEffect(.regular, in: Circle())
                  } else {
                      Circle().fill(.ultraThinMaterial)
                  }''', '        Circle().fill(.ultraThinMaterial)'),
              ('''        if #available(iOS 26.0, *) {
                      if circle { Circle().fill(.clear).glassEffect(.regular, in: Circle()) }
                      else { RoundedRectangle(cornerRadius: 18).fill(.clear)
                               .glassEffect(.regular, in: RoundedRectangle(cornerRadius: 18)) }
                  } else {
                      if circle { Circle().fill(.ultraThinMaterial) }
                      else { RoundedRectangle(cornerRadius: 18).fill(.ultraThinMaterial) }
                  }''', '''        if circle { Circle().fill(.ultraThinMaterial) }
                  else { RoundedRectangle(cornerRadius: 18).fill(.ultraThinMaterial) }'''),
          ]
          for old, fallback in blocks:
              assert text.count(old) == 1
              replacement = '        #if compiler(>=6.2)\n' + old + '\n        #else\n' + fallback + '\n        #endif'
              text = text.replace(old, replacement)
          p.write_text(text, encoding='utf-8')
          print('Guarded two iOS 26 glass-effect branches; kept their existing material fallbacks.')
          PY
          git diff -- scripts/build/ app/Madeira/ContentView.swift > build-logs/build-script.patch
          git -C FEX diff > build-logs/fex-ios.patch

      - name: Install build tools and check bundled resources
        run: |
          brew install cmake ninja meson pkg-config autoconf automake libtool bison flex sevenzip llvm 2>&1 | tee build-logs/dependencies.log
          command -v xxd
          bash tools/check-prefix-template.sh app/Madeira/prefix-template.tar.gz
          xcodebuild -list -project app/Madeira.xcodeproj

      - name: Prepare the Windows cross compiler
        run: bash scripts/build/setup-llvm-mingw.sh 2>&1 | tee build-logs/mingw.log

      - name: Restore completed Wine tools
        id: wine-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            source/wine/build-macos
            source/wine/build-arm64ec
          key: macos15-arm64-xcode16-ef49682-wine-tools-v1

      - name: Build Wine host tools and headers
        run: bash scripts/build/build-wine.sh 2>&1 | tee build-logs/wine.log

      - name: Cache completed Wine tools
        if: steps.wine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            source/wine/build-macos
            source/wine/build-arm64ec
          key: macos15-arm64-xcode16-ef49682-wine-tools-v1

      - name: Restore completed FEX build
        id: fex-cache
        uses: actions/cache/restore@v4
        with:
          path: source/FEX/build-ios
          key: macos15-arm64-xcode16-ef49682-fex-ios-static-v2

      - name: Build the FEX CPU translator for iOS
        run: bash scripts/build/build-fex-ios.sh 2>&1 | tee build-logs/fex.log

      - name: Cache completed FEX build
        if: steps.fex-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: source/FEX/build-ios
          key: macos15-arm64-xcode16-ef49682-fex-ios-static-v2

      - name: Restore completed iOS support libraries
        id: support-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            source/app/Madeira/libgmp.a
            source/app/Madeira/libnettle.a
            source/app/Madeira/libhogweed.a
            source/app/Madeira/libgnutls.a
            source/app/Madeira/libwineserver.a
            source/app/Madeira/libntdll_unix.a
            source/app/Madeira/libwin32u_unix.a
          key: macos15-arm64-xcode16-ef49682-support-v1

      - name: Build iOS support libraries
        if: steps.support-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/build/build-freetype-ios.sh 2>&1 | tee build-logs/freetype.log
          bash build/gnutls-ios/build.sh 2>&1 | tee build-logs/gnutls.log
          bash scripts/build/sync-gnutls-libs.sh
          bash build/wineserver/bootstrap.sh 2>&1 | tee build-logs/wineserver-bootstrap.log
          bash build/wineserver/build.sh 2>&1 | tee build-logs/wineserver.log
          bash build/ntdll-unix/build.sh 2>&1 | tee build-logs/ntdll.log
          bash build/win32u-unix/build.sh 2>&1 | tee build-logs/win32u.log

      - name: Cache completed iOS support libraries
        if: steps.support-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            source/app/Madeira/libgmp.a
            source/app/Madeira/libnettle.a
            source/app/Madeira/libhogweed.a
            source/app/Madeira/libgnutls.a
            source/app/Madeira/libwineserver.a
            source/app/Madeira/libntdll_unix.a
            source/app/Madeira/libwin32u_unix.a
          key: macos15-arm64-xcode16-ef49682-support-v1

      - name: Restore LLVM build progress
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            source/toolchains/llvm-project
            source/toolchains/llvm-host-build
            source/toolchains/llvm-ios-build
          key: macos15-arm64-xcode16-ef49682-llvm15-static-v2-${{ github.run_id }}
          restore-keys: macos15-arm64-xcode16-ef49682-llvm15-static-v2-

      - name: Build LLVM for the graphics translator
        id: llvm-build
        run: bash scripts/build/build-llvm-ios.sh 2>&1 | tee build-logs/llvm.log

      - name: Save LLVM progress even if compilation fails
        if: always() && (steps.llvm-build.outcome == 'success' || steps.llvm-build.outcome == 'failure')
        uses: actions/cache/save@v4
        with:
          path: |
            source/toolchains/llvm-project
            source/toolchains/llvm-host-build
            source/toolchains/llvm-ios-build
          key: macos15-arm64-xcode16-ef49682-llvm15-static-v2-${{ github.run_id }}

      - name: Build Metal shaders and DXMT
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          bash scripts/build/build-shader-headers.sh 2>&1 | tee build-logs/shaders.log
          bash scripts/build/build-dxmt-ios.sh 2>&1 | tee build-logs/dxmt.log

      - name: Extract Microsoft runtime libraries and package the IPA
        run: |
          bash scripts/build/prepare-vcruntime.sh 2>&1 | tee build-logs/vcruntime.log
          bash scripts/build/package-ipa.sh 2>&1 | tee build-logs/package.log
          shasum -a 256 dist/Madeira.ipa | tee dist/Madeira.ipa.sha256
          {
            echo 'Source: JMRBDev/Madeira'
            echo 'Commit: ef496822ca427b4b000eaf7c78d3a570e23182e1'
            echo 'Minimum iPadOS: 18.0'
            echo 'The IPA requires personal development signing and JIT activation.'
            echo 'Packaging success is not an on-device gameplay test.'
          } > dist/BUILD-INFO.txt

      - name: Save installable package
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-iPad-IPA
          path: |
            source/dist/Madeira.ipa
            source/dist/Madeira.ipa.sha256
            source/dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 7

      - name: Save diagnostic logs even when compilation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-build-logs
          path: |
            source/build-logs/
            source/build/**/*.err
            source/build/**/*configure.log
            source/build/**/*make.log
            source/wine/build-macos/config.log
            source/wine/build-arm64ec/config.log
          if-no-files-found: warn
          retention-days: 7
